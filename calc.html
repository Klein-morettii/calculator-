<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title> calculator </title>
        <link rel="stylesheet" href="calc.css">
    </head>

    <body>
        <h1 id="heading"> CALCULATOR
            (+, -, *. /) </h1>

        <div id="wrapper">

            <div id="mainBox">

                <div id="brand"><strong> goofu </strong></div>
                <div id="outBox">
                    <div id="output"><strong></strong></div>
                    <div id="result"><strong></strong></div>
                </div>
                <div id="firstLine">
                    <button title="%">%</button>
                    <button title="Clear">CE</button>
                    <button title="Clear all">C</button>
                    <button title="delete">X</button>
                </div>

                <div id="secondLine">
                    <button title="1/x">1/x</button>
                    <button title="square">x^2</button>
                    <button title="square root">x^1/2</button>
                    <button title="divide">/</button>
                </div>

                <div id="thirdLine">
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button title="multiply">*</button>
                </div>

                <div id="fourthLine">
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button title="subtract">-</button>
                </div>

                <div id="fifthLine">
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button title="add">+</button>
                </div>

                <div id="sixthLine">
                    <button title="inverst sign">pi</button>
                    <button>0</button>
                    <button> <strong>.</strong> </button>
                    <button title="equal">=</button>
                </div>

            </div>
        </div>
        <script src="calc.js"></script>
    </body>
</html>
